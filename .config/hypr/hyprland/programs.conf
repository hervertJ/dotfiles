###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$browser = zen-browser
$fileManager = 'yazi pwd'

# apps menu
$menu = pkill rofi || rofi -no-lazy-grab -show drun -modi drun -theme ~/.config/rofi/app-launcher.rasi

# launcher
$dmenu = pkill rofi || sh ~/.config/colorschemes/launcher.sh

# wallpaper select
$wallpaper = pkill rofi || sh ~/scripts/wallpaper.sh
